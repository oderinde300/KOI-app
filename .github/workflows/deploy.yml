name: Deploy to EC2

on:
  push:
    branches:
      - main  

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Log in to Docker Hub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKER_USERNAME }}  # Your Docker Hub username
          password: ${{ secrets.DOCKER_TOKEN }}  # Your Docker Hub password

      - name: Build Docker image
        run: |
          docker build -t koi:latest -f ./koi/Dockerfile ./koi

      - name: Push Docker image to Docker Hub
        run: |
          docker push koi:latest

      - name: Deploy to EC2
        env:
          PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
          HOST: ${{ secrets.EC2_HOST }}
          USER: ${{ secrets.EC2_USER }}
        run: |
          echo "${PRIVATE_KEY}" > private_key.pem
          chmod 600 private_key.pem
          ssh -o StrictHostKeyChecking=no -i private_key.pem ${USER}@${HOST} << 'EOF'
            # Pull the latest image
            docker pull koi:latest
            # Stop and remove the existing container
            docker stop koi || true
            docker rm koi || true
            # Run the new container
            docker run -d --name koi -p 3000:3000 koi:latest

          EOF
